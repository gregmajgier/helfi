name: Deploy backend to Azure

on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "infra/**"
      - ".github/workflows/deploy-backend.yml"

permissions:
  id-token: write
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/helfi-api
  RESOURCE_GROUP: rg-production
  AZURE_ENV_NAME: production
  AZURE_LOCATION: westeurope

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest

      - name: Log in to Azure (OIDC)
        uses: azure/login@8216e11d8cd9b42fe925c852af8e76311ff067ac # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy infrastructure and roll out new image
        uses: azure/cli@d4515bc8e518874d3c814bf5c307a1cb08ec9b35 # v2
        with:
          inlineScript: |
            az deployment group create \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --template-file infra/main.bicep \
              --parameters \
                environmentName=${{ env.AZURE_ENV_NAME }} \
                location=${{ env.AZURE_LOCATION }} \
                jwtSecret='${{ secrets.JWT_SECRET }}' \
                anthropicApiKey='${{ secrets.ANTHROPIC_API_KEY }}' \
                googleOauthClientId='${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}' \
                appleOauthBundleId='${{ secrets.APPLE_OAUTH_BUNDLE_ID }}' \
                apiContainerImage=${{ env.IMAGE_NAME }}:${{ github.sha }}
